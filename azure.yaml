# yaml-language-server: $schema=https://aka.ms/azure-dev/v1.0/azure.yaml.json
name: foundry-agents-with-agentgateway-gateway
metadata:
  template: foundry-agents-with-agentgateway-gateway
requiredVersions:
  azd: '>=1.35.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.18'
services:
  ai-tutor-hosted-agent:
    host: azure.ai.agent
    project: agents/ai-tutor-hosted-agent
    language: python
    kind: hosted
    name: ai-tutor-hosted-agent
    description: An independent Python AI tutor using Microsoft Agent Framework and agentgateway.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AGENTGATEWAY_BASE_URL: ${AGENTGATEWAY_HOSTED_BASE_URL}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      OTEL_SERVICE_NAME: ai-tutor-hosted-agent
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
    hooks:
      postdeploy:
        shell: sh
        dir: ../..
        run: node scripts/grant-hosted-agent-access.mjs
hooks:
  preprovision:
    shell: sh
    run: |
      set -eu
      test -n "${AGENTGATEWAY_ENTRA_CLIENT_ID:-}" || { echo "AGENTGATEWAY_ENTRA_CLIENT_ID is required; configure Entra registrations first." >&2; exit 1; }
      test -n "${PROMPT_GATEWAY_CLIENT_ID:-}" || { echo "PROMPT_GATEWAY_CLIENT_ID is required; configure Entra registrations first." >&2; exit 1; }
      test -n "${PROMPT_GATEWAY_PRINCIPAL_ID:-}" || { echo "PROMPT_GATEWAY_PRINCIPAL_ID is required for prompt OAuth authentication." >&2; exit 1; }
      test -n "${PROMPT_GATEWAY_CLIENT_SECRET:-}" || { echo "Supply PROMPT_GATEWAY_CLIENT_SECRET from Key Vault through the process environment." >&2; exit 1; }
  postprovision:
    shell: sh
    run: |
      set -eu
      revision="$(az containerapp show --name "$AGENTGATEWAY_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)"
      az containerapp revision restart --name "$AGENTGATEWAY_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$revision" --output none
      node scripts/deploy-prompt-agent.mjs
  postdeploy:
    shell: sh
    run: node scripts/deploy-prompt-agent.mjs
infra:
  provider: bicep
  path: infra
  module: main
